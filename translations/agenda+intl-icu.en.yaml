      title: "How to"
      create: "In Google Calendar (on a computer, calendar.google.com), make a calendar for the concerts only: \"Other calendars\" › \"+\" › \"Create new calendar\", named \"Concerts\"."
      share: "If the agency keeps the dates too: the calendar's \"Settings and sharing\" › \"Share with specific people\" › its address, with \"Make changes to events\"."
      secret: "In the same settings, \"Integrate calendar\" › \"Secret address in iCal format\": copy it."
      paste: "Paste it above and save. That is all: from now on the concerts are written in Google Calendar, on the phone or the computer."
      write: "A concert is an event of that calendar: the title is the concert's name, the location the hall and its address, the hours the concert's, and the description one piece of information per line - for example:"
